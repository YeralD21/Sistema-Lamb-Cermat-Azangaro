<div class="min-h-screen bg-slate-50 flex">
  
  <!-- Sidebar Panel -->
  <aside 
    class="bg-blue-950 text-white transition-all duration-300 flex flex-col"
    [ngClass]="isSidebarOpen ? 'w-64' : 'w-20'"
  >
    <div class="p-4 flex items-center justify-between border-b border-white/10">
      <div class="flex items-center gap-2 overflow-hidden" *ngIf="isSidebarOpen">
        <div class="w-8 h-8 bg-white rounded-full flex-shrink-0 flex items-center justify-center">
          <span class="text-blue-950 font-bold text-xs">CS</span>
        </div>
        <span class="font-bold truncate">CERMAT Portal</span>
      </div>
      <button (click)="toggleSidebar()" class="p-1 hover:bg-white/10 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="isSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
          <path *ngIf="!isSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <!-- Navigation Area (To be expanded in future phases) -->
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <p class="text-xs font-semibold text-blue-300 uppercase tracking-wider mb-4" *ngIf="isSidebarOpen">
        Menú Principal
      </p>
      <a routerLink="/app/dashboard"
         routerLinkActive="bg-white/10 border-l-4 border-yellow-400"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 transition-colors">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        <span *ngIf="isSidebarOpen">Dashboard</span>
      </a>
      
      <!-- Role indicator in sidebar -->
      <div class="mt-8 p-3 bg-blue-900/50 rounded-lg border border-white/5" *ngIf="isSidebarOpen && currentUser">
        <p class="text-xs text-blue-200">Rol actual simulado:</p>
        <p class="font-semibold text-yellow-400 capitalize">{{ currentUser.role }}</p>
      </div>
    </nav>

    <!-- User & Logout -->
    <div class="p-4 border-t border-white/10">
      <div class="flex items-center" [ngClass]="isSidebarOpen ? 'justify-between' : 'justify-center'">
        <div class="flex items-center gap-3 overflow-hidden" *ngIf="isSidebarOpen">
          <div class="w-8 h-8 rounded-full bg-blue-500/30 flex items-center justify-center flex-shrink-0 text-white font-medium">
            {{ currentUser?.name?.charAt(0) || 'U' }}
          </div>
          <div class="truncate">
            <p class="text-sm font-medium truncate">{{ currentUser?.name }}</p>
            <p class="text-xs text-blue-300 truncate">{{ currentUser?.email }}</p>
          </div>
        </div>
        <button (click)="logout()" title="Cerrar sesión" class="p-2 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-lg transition-colors flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Topbar Mobile -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center px-4 justify-between lg:hidden">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-950 rounded-full flex items-center justify-center">
          <span class="text-white font-bold text-xs">CS</span>
        </div>
        <span class="font-bold text-blue-950">Portal</span>
      </div>
      <button (click)="toggleSidebar()" class="p-2 -mr-2 text-slate-500 hover:bg-slate-100 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
    </header>

    <!-- Content Router Outlet -->
    <div class="flex-1 overflow-auto bg-slate-50/50 p-4 lg:p-8 relative">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
