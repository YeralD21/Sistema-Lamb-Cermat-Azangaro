<div class="space-y-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-slide-up">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 relative overflow-hidden">
    <!-- Decorative background -->
    <div class="absolute -right-10 -top-10 w-40 h-40 bg-cermat-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 flex items-center gap-4">
      <div class="w-14 h-14 bg-cermat-blue-50 rounded-2xl flex items-center justify-center border border-cermat-blue-100 shadow-sm shrink-0">
        <i data-lucide="megaphone" class="w-7 h-7 text-cermat-blue-600"></i>
      </div>
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Comunicados</h1>
        <p class="text-slate-500 mt-1 font-medium">Gestiona y publica anuncios oficiales para estudiantes y apoderados</p>
      </div>
    </div>
    
    <button (click)="openModal()" class="relative z-10 inline-flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-cermat-blue-600 to-cermat-blue-800 hover:from-cermat-blue-700 hover:to-cermat-blue-900 text-white rounded-xl transition-all duration-300 shadow-lg shadow-cermat-blue-500/30 font-bold hover:shadow-cermat-blue-500/50 hover:-translate-y-0.5 mt-4 sm:mt-0 w-full sm:w-auto justify-center">
      <i data-lucide="plus" class="w-5 h-5"></i> Redactar Nuevo
    </button>
  </div>

  <!-- Content Section -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden relative group p-6">
    <div class="space-y-4">
      <div *ngFor="let c of communications" class="p-5 rounded-xl border border-slate-200/70 hover:border-cermat-blue-300 hover:shadow-md hover:shadow-cermat-blue-500/5 transition-all flex flex-col sm:flex-row sm:items-center justify-between group/item bg-slate-50/50 relative overflow-hidden">
        
        <div class="absolute left-0 top-0 bottom-0 w-1 transition-colors duration-300" [ngClass]="c.status === 'Enviado' ? 'bg-emerald-500' : 'bg-slate-300'"></div>

        <div class="pl-3 flex flex-col gap-1.5">
          <div class="flex items-center gap-3">
             <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-sm" [ngClass]="c.type === 'reunion' ? 'bg-blue-500' : 'bg-orange-500'">
                <i *ngIf="c.type === 'reunion'" data-lucide="users" class="w-4 h-4"></i>
                <i *ngIf="c.type === 'aviso'" data-lucide="bell" class="w-4 h-4"></i>
             </div>
             <h3 class="font-bold text-lg text-slate-900 group-hover/item:text-cermat-blue-700 transition-colors">{{ c.title }}</h3>
          </div>
          <div class="flex items-center gap-4 ml-11">
             <span class="text-sm font-semibold text-slate-500 flex items-center gap-1.5"><i data-lucide="users" class="w-4 h-4 text-slate-400"></i> {{ c.audience }}</span>
             <span class="text-xs text-slate-400">•</span>
             <span class="text-sm text-slate-500 flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i> {{ c.date }}</span>
          </div>
        </div>
        
        <div class="flex items-center gap-4 mt-4 sm:mt-0 ml-11 sm:ml-0">
          <span class="px-3 py-1.5 rounded-lg text-xs font-extrabold shadow-sm uppercase tracking-wider ring-1 ring-inset" 
                [ngClass]="c.status === 'Enviado' ? 'bg-emerald-50 text-emerald-700 ring-emerald-200' : 'bg-slate-100 text-slate-600 ring-slate-200'">
             {{ c.status }}
          </span>
          <button class="w-10 h-10 flex flex-col items-center justify-center text-slate-400 hover:text-cermat-blue-600 hover:bg-cermat-blue-50 rounded-xl transition-all outline-none tooltip border border-transparent hover:border-cermat-blue-100" title="Ver detalle">
             <i data-lucide="eye" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </div>
    
    <div *ngIf="communications.length === 0" class="text-center py-12">
      <div class="w-16 h-16 bg-slate-50 rounded-full mx-auto mb-4 flex items-center justify-center border border-slate-100">
         <i data-lucide="inbox" class="w-8 h-8 text-slate-400"></i>
      </div>
      <p class="font-bold text-slate-600">No tienes comunicados publicados</p>
    </div>
  </div>
</div>

<!-- Modal Redactar Comunicado -->
<div *ngIf="isModalOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-slide-up">
    <!-- Modal Header -->
    <div class="bg-cermat-blue-50 border-b border-cermat-blue-100 px-6 py-4 flex items-center justify-between">
      <h3 class="text-xl font-bold text-cermat-blue-900 flex items-center gap-2">
        <i data-lucide="pen-tool" class="w-5 h-5 text-cermat-blue-600"></i>
        Nuevo Comunicado
      </h3>
      <button (click)="closeModal()" class="text-cermat-blue-400 hover:text-cermat-blue-700 transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    
    <!-- Modal Body -->
    <div class="p-6">
      <form (ngSubmit)="submitComm()" #commForm="ngForm">
        <div class="space-y-4">
          
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Público Destino</label>
            <select [(ngModel)]="newComm.audience" name="audience" required
                    class="w-full px-4 py-2 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-cermat-blue-500/20 focus:border-cermat-blue-500 transition-all outline-none text-slate-700 bg-slate-50 focus:bg-white font-medium hover:border-slate-300">
              <option value="" disabled selected>Seleccione la audiencia</option>
              <option *ngFor="let a of audiences" [value]="a">{{ a }}</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Título del Anuncio</label>
            <input type="text" [(ngModel)]="newComm.title" name="title" required placeholder="Ej: Invitación a evento cultural"
                   class="w-full px-4 py-2 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-cermat-blue-500/20 focus:border-cermat-blue-500 transition-all outline-none text-slate-700 bg-slate-50 focus:bg-white hover:border-slate-300">
          </div>
            
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Contenido detallado</label>
            <textarea [(ngModel)]="newComm.content" name="content" rows="4" required placeholder="Escribe aquí los detalles del comunicado..."
                      class="w-full px-4 py-2 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-cermat-blue-500/20 focus:border-cermat-blue-500 transition-all outline-none resize-none text-slate-700 bg-slate-50 focus:bg-white hover:border-slate-300"></textarea>
          </div>
          
        </div>

        <!-- Modal Footer -->
        <div class="mt-8 flex gap-3">
          <button type="button" (click)="closeModal()" class="flex-1 px-5 py-2.5 bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold rounded-xl transition-colors">
            Descartar
          </button>
          <button type="submit" [disabled]="!commForm.valid" class="flex-1 px-5 py-2.5 bg-cermat-blue-600 text-white hover:bg-cermat-blue-700 font-bold rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i> Publicar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
