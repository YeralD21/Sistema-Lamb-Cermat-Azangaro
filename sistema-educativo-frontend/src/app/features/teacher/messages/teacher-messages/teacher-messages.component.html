<div class="space-y-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-slide-up">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 relative overflow-hidden">
    <!-- Decorative background -->
    <div class="absolute -right-10 -top-10 w-40 h-40 bg-cermat-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 flex items-center gap-4">
      <div class="w-14 h-14 bg-cermat-blue-50 rounded-2xl flex items-center justify-center border border-cermat-blue-100 shadow-sm shrink-0">
        <i data-lucide="message-square" class="w-7 h-7 text-cermat-blue-600"></i>
      </div>
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Caja de Mensajes</h1>
        <p class="text-slate-500 mt-1 font-medium">Buzón de conversación directa con apoderados y dirección</p>
      </div>
    </div>
    
    <button (click)="openCompose()" class="relative z-10 inline-flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-cermat-blue-600 to-cermat-blue-800 hover:from-cermat-blue-700 hover:to-cermat-blue-900 text-white rounded-xl transition-all duration-300 shadow-lg shadow-cermat-blue-500/30 font-bold hover:shadow-cermat-blue-500/50 hover:-translate-y-0.5 mt-4 sm:mt-0 w-full sm:w-auto justify-center">
      <i data-lucide="edit-3" class="w-5 h-5"></i> Redactar Nuevo
    </button>
  </div>

  <!-- Content Section -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden relative">
    <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
      <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
        <i data-lucide="inbox" class="w-5 h-5 text-cermat-blue-600"></i> Bandeja de Entrada
      </h2>
    </div>
    
    <div class="w-full">
      <div *ngFor="let m of messages" class="group flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 sm:p-6 border-b border-slate-100 hover:bg-slate-50/80 cursor-pointer transition-colors relative" [ngClass]="{'bg-blue-50/20': m.unread}">
        
        <div class="absolute left-0 top-0 bottom-0 w-1 transition-colors duration-300" [ngClass]="m.unread ? 'bg-cermat-blue-500' : 'bg-transparent'"></div>

        <!-- Sender info -->
        <div class="flex items-center gap-4 w-full sm:w-1/4 shrink-0 pl-2">
          <div class="w-12 h-12 rounded-full border border-cermat-blue-200 bg-white flex items-center justify-center text-cermat-blue-700 shrink-0 font-extrabold shadow-sm">
            {{ m.sender.charAt(0) }}
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span *ngIf="m.unread" class="w-2.5 h-2.5 rounded-full bg-cermat-blue-500 animate-pulse shadow-sm shadow-blue-500/50"></span>
              <span class="font-bold text-slate-900 truncate max-w-[150px] inline-block group-hover:text-cermat-blue-700 transition-colors">{{ m.sender }}</span>
            </div>
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mt-0.5" *ngIf="m.unread">Mensaje Nuevo</p>
          </div>
        </div>
        
        <!-- Preview snippet -->
        <div class="flex-1 w-full sm:w-auto mt-3 sm:mt-0 pl-0 sm:pl-6 sm:border-l sm:border-slate-200 text-sm font-medium" [ngClass]="m.unread ? 'text-slate-800' : 'text-slate-500'">
          {{ m.preview }}
        </div>
        
        <!-- Time & Actions -->
        <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto shrink-0 mt-4 sm:mt-0">
          <span class="text-xs font-bold text-slate-500 px-3 py-1.5 bg-slate-100 border border-slate-200 rounded-lg shadow-sm whitespace-nowrap">{{ m.time }}</span>
          
          <button class="w-10 h-10 rounded-xl flex items-center justify-center bg-white border border-slate-200 text-slate-400 group-hover:bg-cermat-blue-50 group-hover:text-cermat-blue-600 group-hover:border-cermat-blue-200 hover:scale-110 transition-all duration-300 shadow-sm outline-none tooltip" title="Abrir hilo">
            <i data-lucide="corner-up-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="messages.length === 0" class="text-center py-16 animate-fade-in-up">
      <div class="w-24 h-24 bg-slate-50 rounded-full mx-auto mb-6 flex items-center justify-center shadow-inner border border-slate-100">
         <i data-lucide="message-square-off" class="w-12 h-12 text-slate-300"></i>
      </div>
      <h3 class="text-xl font-extrabold text-slate-900 mb-2">Buzón Vacío</h3>
      <p class="text-slate-500 font-medium max-w-md mx-auto">Actualmente no tienes mensajes en tu bandeja de entrada.</p>
    </div>
  </div>
</div>

<!-- Modal Redactar Mensaje -->
<div *ngIf="isComposeOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" (click)="closeCompose()"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-slide-up">
    <!-- Modal Header -->
    <div class="bg-cermat-blue-50 border-b border-cermat-blue-100 px-6 py-4 flex items-center justify-between">
      <h3 class="text-xl font-bold text-cermat-blue-900 flex items-center gap-2">
        <i data-lucide="edit-3" class="w-5 h-5 text-cermat-blue-600"></i>
        Nuevo Mensaje
      </h3>
      <button (click)="closeCompose()" class="text-cermat-blue-400 hover:text-cermat-blue-700 transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    
    <!-- Modal Body -->
    <div class="p-6">
      <form (ngSubmit)="sendMessage()" #composeForm="ngForm">
        <div class="space-y-4">
          
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Para (Apoderado / Colaborador)</label>
            <select [(ngModel)]="newMessage.to" name="to" required
                    class="w-full px-4 py-2 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-cermat-blue-500/20 focus:border-cermat-blue-500 transition-all outline-none text-slate-700 bg-slate-50 focus:bg-white font-medium hover:border-slate-300">
              <option value="" disabled selected>Seleccione el destinatario</option>
              <option *ngFor="let p of parentsAndStaff" [value]="p">{{ p }}</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Asunto</label>
            <input type="text" [(ngModel)]="newMessage.subject" name="subject" required placeholder="Ej: Avance de curso..."
                   class="w-full px-4 py-2 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-cermat-blue-500/20 focus:border-cermat-blue-500 transition-all outline-none text-slate-700 bg-slate-50 focus:bg-white hover:border-slate-300">
          </div>
            
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Cuerpo del Mensaje</label>
            <textarea [(ngModel)]="newMessage.body" name="body" rows="4" required placeholder="Escriba aquí su mensaje..."
                      class="w-full px-4 py-2 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-cermat-blue-500/20 focus:border-cermat-blue-500 transition-all outline-none resize-none text-slate-700 bg-slate-50 focus:bg-white hover:border-slate-300"></textarea>
          </div>
          
        </div>

        <!-- Modal Footer -->
        <div class="mt-8 flex gap-3">
          <button type="button" (click)="closeCompose()" class="flex-1 px-5 py-2.5 bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold rounded-xl transition-colors">
            Descartar
          </button>
          <button type="submit" [disabled]="!composeForm.valid" class="flex-1 px-5 py-2.5 bg-cermat-blue-600 text-white hover:bg-cermat-blue-700 font-bold rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i> Enviar Mensaje
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
