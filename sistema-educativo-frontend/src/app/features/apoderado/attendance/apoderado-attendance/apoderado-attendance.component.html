<div class="space-y-6 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-slide-up">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 relative overflow-hidden">
    <!-- Decorative background -->
    <div class="absolute -right-10 -top-10 w-40 h-40 bg-cermat-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Asistencia Escolar</h1>
      <p class="text-slate-500 mt-1 font-medium">Registro histórico detallado de faltas y tardanzas</p>
    </div>
    <button (click)="openModal()" class="relative z-10 inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-cermat-blue-600 to-cermat-blue-800 hover:from-cermat-blue-700 hover:to-cermat-blue-900 text-white rounded-xl transition-all duration-300 shadow-lg shadow-cermat-blue-500/30 hover:shadow-cermat-blue-500/50 hover:-translate-y-0.5 font-bold">
      <i data-lucide="file-plus" class="w-5 h-5"></i> Enviar Justificación
    </button>
  </div>

  <!-- Content Section -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden">
    <div class="p-6 border-b border-slate-100 bg-slate-50/50">
      <h2 class="text-lg font-bold text-slate-800">Historial Reciente</h2>
    </div>
    <div class="overflow-x-auto w-full">
      <table class="w-full text-left border-collapse whitespace-nowrap">
        <thead>
          <tr class="bg-white border-b border-slate-100">
            <th class="py-4 px-6 font-bold text-slate-500 text-xs uppercase tracking-wider">Fecha</th>
            <th class="py-4 px-6 font-bold text-slate-500 text-xs uppercase tracking-wider">Materia</th>
            <th class="py-4 px-6 font-bold text-slate-500 text-xs uppercase tracking-wider">Situación / Motivo</th>
            <th class="py-4 px-6 font-bold text-slate-500 text-xs uppercase tracking-wider text-center">Estado</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr *ngFor="let a of absences" class="hover:bg-slate-50/80 transition-colors group">
            <td class="py-4 px-6">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600 group-hover:scale-110 transition-transform">
                  <i data-lucide="calendar" class="w-5 h-5"></i>
                </div>
                <span class="font-semibold text-slate-900">{{ a.date }}</span>
              </div>
            </td>
            <td class="py-4 px-6 font-medium text-slate-700">{{ a.subject }}</td>
            <td class="py-4 px-6 text-slate-500">{{ a.reason }}</td>
            <td class="py-4 px-6 text-center">
              <span *ngIf="a.status === 'Justificada'" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/60 shadow-sm">
                <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Justificada
              </span>
              <span *ngIf="a.status === 'Injustificada'" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200/60 shadow-sm">
                <i data-lucide="x-circle" class="w-3.5 h-3.5"></i> Injustificada
              </span>
            </td>
          </tr>
          <!-- Empty State fallback -->
          <tr *ngIf="absences.length === 0">
            <td colspan="4" class="py-12 text-center text-slate-500">
              <div class="flex flex-col items-center justify-center space-y-3">
                <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center">
                  <i data-lucide="check-square" class="w-8 h-8 text-slate-400"></i>
                </div>
                <p class="font-medium text-slate-600">No se registran faltas o tardanzas</p>
                <p class="text-sm">Todo está en orden con la asistencia.</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Justificación -->
<div *ngIf="isModalOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-slide-up">
    <!-- Modal Header -->
    <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex items-center justify-between">
      <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <i data-lucide="file-text" class="w-5 h-5 text-cermat-blue-600"></i>
        Nueva Justificación
      </h3>
      <button (click)="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    
    <!-- Modal Body -->
    <div class="p-6">
      <form (ngSubmit)="submitJustification()" #justificationForm="ngForm">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha de Inasistencia</label>
            <input type="date" [(ngModel)]="justification.date" name="date" required
                   class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cermat-blue-500 focus:border-cermat-blue-500 transition-all outline-none text-slate-600 bg-slate-50 focus:bg-white">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Motivo detallado</label>
            <textarea [(ngModel)]="justification.reason" name="reason" rows="3" required placeholder="Ej: Cita médica de emergencia..."
                      class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cermat-blue-500 focus:border-cermat-blue-500 transition-all outline-none resize-none text-slate-600 bg-slate-50 focus:bg-white"></textarea>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Evidencia (Opcional)</label>
            <input type="file"
                   class="block w-full text-sm text-slate-500
                          file:mr-4 file:py-2.5 file:px-4
                          file:rounded-xl file:border-0
                          file:text-sm file:font-semibold
                          file:bg-cermat-blue-50 file:text-cermat-blue-700
                          hover:file:bg-cermat-blue-100 transition-colors cursor-pointer"/>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="mt-8 flex gap-3">
          <button type="button" (click)="closeModal()" class="flex-1 px-5 py-2.5 bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold rounded-xl transition-colors">
            Cancelar
          </button>
          <button type="submit" [disabled]="!justificationForm.valid" class="flex-1 px-5 py-2.5 bg-cermat-blue-600 text-white hover:bg-cermat-blue-700 font-bold rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i> Enviar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
