<div class="space-y-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-slide-up">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 relative overflow-hidden">
    <div class="absolute -right-10 -top-10 w-40 h-40 bg-cermat-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Comunicados Oficiales</h1>
      <p class="text-slate-500 mt-1 font-medium">Buzón central de circulares y normativa institucional</p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden">
    <div class="p-4 sm:p-6 space-y-4">
      <!-- Mapped Communications -->
      <div *ngFor="let c of communications" class="p-5 rounded-xl border border-slate-200 hover:border-cermat-blue-400 hover:shadow-lg hover:shadow-cermat-blue-500/10 transition-all duration-300 flex items-center justify-between group cursor-pointer" [ngClass]="c.status === 'Nuevo' ? 'bg-cermat-blue-50/40 relative overflow-hidden' : 'bg-white'">
        <!-- New indicator border -->
        <div *ngIf="c.status === 'Nuevo'" class="absolute left-0 top-0 bottom-0 w-1.5 bg-cermat-blue-500"></div>
        
        <div class="flex items-start gap-4" [ngClass]="{'pl-2': c.status === 'Nuevo'}">
          <!-- Icon -->
          <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 group-hover:bg-cermat-blue-100 group-hover:text-cermat-blue-600 transition-colors shrink-0">
             <i data-lucide="bell" class="w-6 h-6"></i>
          </div>
          
          <!-- Text Body -->
          <div>
            <div class="flex flex-wrap items-center gap-3 mb-1">
              <h3 class="font-extrabold text-lg text-slate-900 group-hover:text-cermat-blue-700 transition-colors">
                {{ c.title }}
              </h3>
              <span *ngIf="c.status === 'Nuevo'" class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-cermat-blue-600 text-white uppercase tracking-wider">Nuevo</span>
            </div>
            <p class="text-sm font-medium text-slate-500 flex items-center gap-2">
              <i data-lucide="user" class="w-4 h-4 text-slate-400"></i> {{ c.sender }} 
              <span class="text-slate-300">•</span>
              <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i> {{ c.date }}
            </p>
          </div>
        </div>
        
        <!-- Action Chevron -->
        <div class="flex items-center gap-3 shrink-0">
          <button class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-50 border border-slate-100 text-slate-400 group-hover:bg-cermat-blue-50 group-hover:text-cermat-blue-600 group-hover:border-cermat-blue-200 transition-all duration-300 hover:scale-110">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
