<div class="space-y-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-slide-up">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 relative overflow-hidden">
    <div class="absolute -right-10 -top-10 w-40 h-40 bg-cermat-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Tareas Escolares</h1>
      <p class="text-slate-500 mt-1 font-medium">Supervisión en tiempo real de actividades y proyectos pendientes</p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let t of tasks" class="bg-white rounded-2xl border border-slate-200/60 p-6 flex flex-col shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative group overflow-hidden">
      <!-- Top color bar indicator -->
      <div class="absolute top-0 inset-x-0 h-1.5 transition-colors" [ngClass]="t.status === 'Entregado' ? 'bg-emerald-500' : 'bg-amber-500'"></div>
      
      <!-- Status Badge -->
      <div class="flex justify-between items-start mb-4 mt-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold uppercase tracking-wide border"
          [ngClass]="t.status === 'Entregado' ? 'bg-emerald-50 text-emerald-700 border-emerald-200/50' : 'bg-amber-50 text-amber-700 border-amber-200/50'">
          <i [attr.data-lucide]="t.status === 'Entregado' ? 'check-circle-2' : 'clock'" class="w-3.5 h-3.5"></i>
          {{ t.status }}
        </span>
      </div>

      <!-- Content -->
      <h3 class="font-extrabold text-lg text-slate-900 mb-3 leading-snug group-hover:text-cermat-blue-700 transition-colors">{{ t.title }}</h3>
      
      <!-- Footer details -->
      <div class="flex-1 mt-auto space-y-3 pt-4 border-t border-slate-100">
        <div class="flex items-center gap-3 text-sm text-slate-600">
          <div class="w-8 h-8 rounded-lg bg-indigo-50 flex items-center justify-center shrink-0">
            <i data-lucide="book-open" class="w-4 h-4 text-indigo-600"></i>
          </div>
          <span class="font-bold truncate text-slate-700">{{ t.subject }}</span>
        </div>
        
        <div class="flex items-center gap-3 text-sm text-slate-600">
          <div class="w-8 h-8 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center shrink-0">
            <i data-lucide="calendar" class="w-4 h-4 text-slate-600"></i>
          </div>
          <span class="font-medium">Vence: <strong class="text-slate-900 font-bold ml-1">{{ t.dueDate }}</strong></span>
        </div>
      </div>
    </div>
  </div>
</div>
