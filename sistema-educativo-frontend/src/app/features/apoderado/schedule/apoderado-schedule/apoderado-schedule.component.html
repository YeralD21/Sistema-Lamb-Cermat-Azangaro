<div class="space-y-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-slide-up">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 relative overflow-hidden">
    <div class="absolute -right-10 -top-10 w-40 h-40 bg-cermat-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Horario Académico</h1>
      <p class="text-slate-500 mt-1 font-medium">Cronograma oficial de clases y actividades del estudiante</p>
    </div>
    <button (click)="printSchedule()" class="relative z-10 inline-flex items-center gap-2 px-6 py-2.5 bg-cermat-blue-800 hover:bg-cermat-blue-900 text-white rounded-xl transition-all duration-300 shadow-lg shadow-cermat-blue-500/30 hover:-translate-y-0.5 font-bold">
      <i data-lucide="printer" class="w-5 h-5"></i> Imprimir Horario
    </button>
  </div>

  <!-- Content Section -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 p-4 sm:p-6 overflow-hidden">
    <div class="overflow-x-auto w-full pb-4 scrollbar-thin scrollbar-thumb-slate-300 scrollbar-track-transparent">
      <table class="w-full text-center border-collapse whitespace-nowrap min-w-[800px]">
        <thead>
          <tr>
            <th class="border-b-2 border-r-2 border-slate-200 py-4 px-4 bg-slate-100 text-slate-700 font-bold uppercase tracking-widest text-xs w-32 rounded-tl-xl">
              <div class="flex items-center justify-center gap-2">
                 <i data-lucide="clock" class="w-4 h-4"></i> Hora
              </div>
            </th>
            <th *ngFor="let day of days; let last = last" class="border-b-2 border-slate-200 py-4 px-4 bg-slate-50 text-slate-700 font-bold uppercase tracking-widest text-xs" [ngClass]="{'border-r-2': !last, 'rounded-tr-xl': last}">
              <div class="flex flex-col gap-1 items-center">
                <span>{{ day }}</span>
                <div class="w-4 h-1 bg-cermat-blue-500 rounded-full mt-1"></div>
              </div>
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200 border-x border-b border-slate-200 rounded-b-xl">
          <tr *ngFor="let block of blocks; let eventLast = last" class="hover:bg-slate-50/50 transition-colors group">
            <td class="border-r-2 border-slate-200 py-5 px-4 font-bold text-slate-500 bg-slate-50 relative group-hover:bg-slate-100/70 transition-colors" [ngClass]="{'rounded-bl-xl': eventLast}">
              {{ block.time }}
            </td>
            
            <ng-container *ngIf="block.monday === 'RECREO'; else classes">
              <td colspan="5" class="py-0 px-0 bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,theme('colors.amber.50')_10px,theme('colors.amber.50')_20px)] bg-amber-100/50">
                <div class="w-full h-full py-4 text-amber-700 font-black tracking-[0.5em] text-sm uppercase flex items-center justify-center gap-4 drop-shadow-sm">
                   <i data-lucide="coffee" class="w-5 h-5 text-amber-600"></i>
                   R e c r e o
                   <i data-lucide="coffee" class="w-5 h-5 text-amber-600"></i>
                </div>
              </td>
            </ng-container>

            <ng-template #classes>
              <td class="border-r border-slate-200 p-2 align-top h-full">
                <!-- Tarjeta interna por clase -->
                <div class="h-full flex flex-col items-center justify-center p-3 rounded-xl border transition-all duration-300 transform group-hover:-translate-y-0.5 font-bold shadow-sm" [ngClass]="{'bg-indigo-50 border-indigo-200 text-indigo-800 hover:shadow-indigo-500/20 hover:bg-indigo-100': block.monday, 'bg-transparent border-transparent': !block.monday}">
                  {{ block.monday }}
                </div>
              </td>
              <td class="border-r border-slate-200 p-2 align-top h-full">
                <div class="h-full flex flex-col items-center justify-center p-3 rounded-xl border transition-all duration-300 transform group-hover:-translate-y-0.5 font-bold shadow-sm" [ngClass]="{'bg-blue-50 border-blue-200 text-blue-800 hover:shadow-blue-500/20 hover:bg-blue-100': block.tuesday, 'bg-transparent border-transparent': !block.tuesday}">
                  {{ block.tuesday }}
                </div>
              </td>
              <td class="border-r border-slate-200 p-2 align-top h-full">
                <div class="h-full flex flex-col items-center justify-center p-3 rounded-xl border transition-all duration-300 transform group-hover:-translate-y-0.5 font-bold shadow-sm" [ngClass]="{'bg-emerald-50 border-emerald-200 text-emerald-800 hover:shadow-emerald-500/20 hover:bg-emerald-100': block.wednesday, 'bg-transparent border-transparent': !block.wednesday}">
                  {{ block.wednesday }}
                </div>
              </td>
              <td class="border-r border-slate-200 p-2 align-top h-full">
                <div class="h-full flex flex-col items-center justify-center p-3 rounded-xl border transition-all duration-300 transform group-hover:-translate-y-0.5 font-bold shadow-sm" [ngClass]="{'bg-rose-50 border-rose-200 text-rose-800 hover:shadow-rose-500/20 hover:bg-rose-100': block.thursday, 'bg-transparent border-transparent': !block.thursday}">
                  {{ block.thursday }}
                </div>
              </td>
              <td class="p-2 align-top h-full">
                <div class="h-full flex flex-col items-center justify-center p-3 rounded-xl border transition-all duration-300 transform group-hover:-translate-y-0.5 font-bold shadow-sm" [ngClass]="{'bg-violet-50 border-violet-200 text-violet-800 hover:shadow-violet-500/20 hover:bg-violet-100': block.friday, 'bg-transparent border-transparent': !block.friday}">
                  {{ block.friday }}
                </div>
              </td>
            </ng-template>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
